name: Checks

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:sitemap
      - run: npm run check:schema
      - run: npm run check:images
      - run: npm run check:pricing
      - run: npm run check:locales
      - run: npm run test:middleware
      - run: npm run test:leads
